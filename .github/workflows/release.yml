name: build

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

on:
  push:
    branches: [main, v3new_with_ai]
    tags: ["v*"]
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.target }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-musl,     cross: "yes" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-musl,    cross: "yes" }
          - { os: ubuntu-latest,  target: armv7-unknown-linux-musleabihf, cross: "yes" }
          - { os: ubuntu-latest,  target: x86_64-unknown-linux-gnu,     cross: "yes" }
          - { os: ubuntu-latest,  target: aarch64-unknown-linux-gnu,    cross: "yes" }
          - { os: windows-latest, target: x86_64-pc-windows-msvc }
          - { os: windows-latest, target: i686-pc-windows-msvc }
          - { os: windows-latest, target: aarch64-pc-windows-msvc }
          - { os: macos-latest,   target: x86_64-apple-darwin }
          - { os: macos-latest,   target: aarch64-apple-darwin }
    steps:
      - uses: actions/checkout@v4

      - name: Install cross
        if: matrix.cross == 'yes'
        run: cargo install cross --locked

      - uses: dtolnay/rust-toolchain@stable

      - name: Build (cross)
        if: matrix.cross == 'yes'
        working-directory: rust/vxcore
        run: cross build --release --target ${{ matrix.target }}

      - name: Build (native)
        if: matrix.cross != 'yes'
        working-directory: rust/vxcore
        run: |
          rustup target add ${{ matrix.target }}
          cargo build --release --target ${{ matrix.target }}

      - name: Package
        shell: bash
        working-directory: rust/vxcore
        run: |
          set -eu
          case "${{ matrix.target }}" in
            *windows*) ext=".exe" ;;
            *)         ext="" ;;
          esac
          case "${{ matrix.target }}" in
            *linux*)   os="linux" ;;
            *windows*) os="windows" ;;
            *darwin*)  os="macos" ;;
            *)         os="unknown" ;;
          esac
          case "${{ matrix.target }}" in
            x86_64-*)  arch="x86_64" ;;
            aarch64-*) arch="aarch64" ;;
            armv7-*)   arch="armv7" ;;
            i686-*)    arch="i686" ;;
            *)         arch="unknown" ;;
          esac
          # linux 区分 gnu / musl，否则两个产物同名会互相覆盖
          if [ "$os" = "linux" ]; then
            case "${{ matrix.target }}" in
              *musl*) libc="musl" ;;
              *)      libc="gnu" ;;
            esac
            name="VxFirmwareExtractor_${os}_${arch}_${libc}${ext}"
          else
            name="VxFirmwareExtractor_${os}_${arch}${ext}"
          fi
          mkdir -p dist
          cp "target/${{ matrix.target }}/release/vxfile_extractor${ext}" "dist/${name}"
          ls -l dist

      - uses: actions/upload-artifact@v4
        with:
          name: VxFirmwareExtractor_${{ matrix.target }}
          path: rust/vxcore/dist/*

  release:
    # 个别目标失败也照样发版，已成功的产物先挂上去
    if: always() && startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true
      - uses: softprops/action-gh-release@v2
        with:
          files: dist/*
          generate_release_notes: true